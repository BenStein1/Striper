name: "code quality"

# Frontend lint/format/type-check/build plus `cargo fmt --check` (run by
# `bun run format:check`). Cheap, so it runs on every push to main and every
# pull request without path filters.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install Rust stable (for cargo fmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check translation consistency
        run: bun run check:translations

      - name: Check model language coverage
        run: bun run check:model-languages

      - name: Test keyboard utilities
        run: bun run test:keyboard

      - name: Test portable installer helpers
        run: bun src/components/update-checker/portableInstaller.test.ts

      - name: Test model search and sorting
        run: bun src/lib/utils/modelSearch.test.ts

      - name: Run ESLint
        run: bun run lint

      - name: Run prettier and cargo fmt
        run: bun run format:check

      - name: Type-check and build frontend
        run: bun run build
