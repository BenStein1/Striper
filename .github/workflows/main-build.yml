name: "Main Branch Build"

# Builds installable packages on every push to main and on every pull request
# so breakage is caught before a release. Artifacts are kept for 30 days so any
# commit has a downloadable, testable build.
#
# Striper targets Windows first: the Windows x64 job produces unsigned NSIS
# (.exe) and MSI installers on both push and PR. The Linux packaging job is
# slower and runs on pushes to main (and manual dispatch) only. No signing
# secrets are required; see build.yml for how optional signing is gated.
# macOS, Windows ARM64 and Linux ARM64 builds remain available through the
# manual "Build Test" and "Release" workflows.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      build-args: ""
      upload-artifacts: true
      sign-binaries: false
      asset-prefix: "striper-windows"
    secrets: inherit

  linux:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "ubuntu-24.04"
      target: "x86_64-unknown-linux-gnu"
      build-args: "--bundles deb,appimage"
      upload-artifacts: true
      sign-binaries: false
      asset-prefix: "striper-linux"
    secrets: inherit
