name: "Main Branch Build"

# Installer packaging is deliberately manual: native speech/GPU builds are
# expensive. Routine commits retain the separate test and code-quality jobs.
# Linux is the default development target; Windows/both remain available.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Installer platform"
        type: choice
        default: linux
        options: [linux, windows, both]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: inputs.platform == 'windows' || inputs.platform == 'both'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      build-args: ""
      upload-artifacts: true
      sign-binaries: false
      asset-prefix: "striper-windows"
    secrets: inherit

  linux:
    if: inputs.platform == 'linux' || inputs.platform == 'both'
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "ubuntu-24.04"
      target: "x86_64-unknown-linux-gnu"
      build-args: "--bundles deb,appimage"
      upload-artifacts: true
      sign-binaries: false
      asset-prefix: "striper-linux"
    secrets: inherit
