[package]
name = "striper-core"
version = "0.1.0"
description = "Platform-independent correction, vocabulary and edit-transaction core for Striper"
authors = ["Striper contributors"]
edition = "2021"
license = "MIT"
publish = false

# Deliberately free of Tauri, audio and GUI dependencies so the shared logic
# builds and tests in seconds on Linux and Windows CI (PLAN.md §8, M1 gate).
[dependencies]
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rusqlite_migration = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1.12"

[dev-dependencies]
tempfile = "3"
