[package]
name = "striper-platform"
version = "0.1.0"
description = "Platform adapters for Striper: focused-window identity on Windows and Linux"
authors = ["Striper contributors"]
edition = "2021"
license = "MIT"
publish = false

# Kept free of C build dependencies so the Windows code can be type-checked
# from Linux with `cargo check --target x86_64-pc-windows-gnu`.
[dependencies]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
